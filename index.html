<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<title>🎮 GameLand — Krypton Studio</title>
<meta name="description" content="مجموعه ۳۰+ مینی‌گیم آنلاین رایگان از Krypton Studio — بدون نصب و معطلی">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameLand">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/animations.css">

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

<!-- Preloader -->
<div class="preloader" id="preloader">
  <div class="preloader-content">
    <div class="preloader-icon">🎮</div>
    <div class="preloader-text">GameLand</div>
    <div class="preloader-sub">v4.0</div>
    <div class="preloader-bar"><div class="preloader-fill"></div></div>
  </div>
</div>

<div class="app-wrap">

  <!-- ============ Header ============ -->
  <header class="app-header">
    <a href="#home" class="app-logo" id="logoLink">
      <div class="logo-mark">🎮</div>
      <div class="logo-text">
        <b>GameLand</b>
        <small>KRYPTON STUDIO</small>
      </div>
    </a>

    <div class="header-actions">
      <button class="icon-btn" id="headerCoins" title="سکه‌ها">
        🪙 <b>0</b>
      </button>
      <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
      <button class="icon-btn avatar-btn" id="headerAvatar" title="پروفایل">👤</button>
    </div>
  </header>

  <!-- ============ App View (سایت) ============ -->
  <main class="app-main" id="appView">
    <div id="viewRoot"></div>
  </main>

  <!-- ============ Game View ============ -->
  <main class="game-view hidden" id="gameView">
    <div class="game-top">
      <button class="btn-back" id="gameBackBtn">→ بازگشت</button>
      <h2 id="gameTitle"></h2>
      <div class="game-actions">
        <button class="icon-btn" id="gameFavBtn" title="علاقه‌مندی">☆</button>
        <button class="icon-btn" id="gameMenuBtn" title="منو">☰</button>
      </div>
    </div>
    <div class="game-stage" id="gameArea"></div>
  </main>

  <!-- ============ Footer ============ -->
  <footer class="app-footer">
    <div>
      ساخته شده با ❤️ توسط <span class="k">Krypton Studio</span>
    </div>
    <div>
      <b>GameLand v4</b> © 2026
    </div>
  </footer>

</div>

<!-- ============ Bottom Nav ============ -->
<nav class="bottom-nav">
  <button data-nav="home" class="active" title="خانه">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">خانه</span>
  </button>
  <button data-nav="favorites" title="علاقه‌مندی">
    <span class="nav-icon">⭐</span>
    <span class="nav-label">علاقه‌مندی</span>
  </button>
  <button data-nav="achievements" title="دستاوردها">
    <span class="nav-icon">🏆</span>
    <span class="nav-label">دستاورد</span>
  </button>
  <button data-nav="stats" title="آمار">
    <span class="nav-icon">📊</span>
    <span class="nav-label">آمار</span>
  </button>
  <button data-nav="shop" title="فروشگاه">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">فروشگاه</span>
  </button>
</nav>

<!-- ============ Sound Toggle ============ -->
<button class="sound-toggle" id="soundToggle" title="صدا">🔊</button>

<!-- ============ ═══════ Scripts — Core ═══════ ============ -->
<script src="app/core.js"></script>
<script src="app/storage.js"></script>

<!-- ============ Settings (قبل از Audio) ============ -->
<script src="app/settings.js"></script>

<!-- ============ Audio (به Settings نیاز داره) ============ -->
<script src="app/audio.js"></script>

<!-- ============ Systems ============ -->
<script src="app/i18n.js"></script>
<script src="app/ui.js"></script>
<script src="app/animations.js"></script>   <!-- 🆕 v5 -->
<script src="app/animations-pro.js"></script>
<script src="app/effects.js"></script>      <!-- 🆕 v5 -->
<script src="app/theme.js"></script>        <!-- 🆕 v5 -->
<script src="app/registry.js"></script>

<!-- ============ Achievements & Data ============ -->
<script src="app/achievements.js"></script>
<script src="app/challenges.js"></script>
<script src="app/leaderboard.js"></script>
<script src="app/stats.js"></script>
<script src="app/shop.js"></script>
<script src="app/rewards.js"></script>
<script src="app/profile.js"></script>

<!-- ============ بازی‌ها (اول اینا) ============ -->
<script src="games/snake.js"></script>
<script src="games/g2048.js"></script>
<script src="games/ttt.js"></script>
<script src="games/memory.js"></script>
<script src="games/reaction.js"></script>
<script src="games/whack.js"></script>
<script src="games/breakout.js"></script>
<script src="games/rps.js"></script>
<script src="games/bubble.js"></script>
<script src="games/flappy.js"></script>
<script src="games/pong.js"></script>
<script src="games/tetris.js"></script>
<script src="games/puzzle.js"></script>
<script src="games/minesweeper.js"></script>
<script src="games/simon.js"></script>
<script src="games/connect4.js"></script>
<script src="games/lightsout.js"></script>
<script src="games/sequence.js"></script>
<script src="games/dice.js"></script>
<script src="games/hangman.js"></script>
<script src="games/slot.js"></script>
<script src="games/color-match.js"></script>
<script src="games/reaction-grid.js"></script>
<script src="games/word-search.js"></script>
<script src="games/yahtzee.js"></script>

<!-- ============ GamesList (بعد از بازی‌ها) ============ -->
<script src="app/games-list.js"></script>

<!-- ============ Hub + Views + Router + App ============ -->
<script src="app/hub.js"></script>
<script src="app/views.js"></script>
<script src="app/router.js"></script>
<script src="app/app.js"></script>

<!-- ============ Service Worker ============ -->
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.warn('SW failed:', err));
  });
}
</script>


</body>
</html>
